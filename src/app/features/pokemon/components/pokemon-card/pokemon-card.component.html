<article class="pokemon-card">
  <img class="pokemon-card__image" [src]="pokemon.image" [alt]="pokemon.name">

  <h2 class="pokemon-card__name">{{ pokemon.name }}</h2>

  <ul class="pokemon-card__details">
    <li><strong>Altura:</strong> {{ pokemon.height }}</li>
    <li><strong>Peso:</strong> {{ pokemon.weight }}</li>
    <li><strong>Experiencia base:</strong> {{ pokemon.baseExperience }}</li>
    <li><strong>Tipos:</strong> {{ pokemon.types.join(', ') }}</li>
    <li><strong>Habilidades:</strong> {{ pokemon.abilities.join(', ') }}</li>
  </ul>
</article>
